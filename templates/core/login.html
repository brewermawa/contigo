{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Contigo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --contigo-green:       #0E6B5B;
      --contigo-green-light: #E1F5EE;
    }

    body {
      background: #F4F6F5;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e8;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .brand-heart {
      width: 36px;
      height: 36px;
      background: var(--contigo-green);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-heart i {
      transform: rotate(45deg);
      color: #fff;
      font-size: 16px;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--contigo-green);
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      text-align: center;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 2rem;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
    }

    .form-control {
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      padding: 10px 12px;
    }

    .form-control:focus {
      border-color: var(--contigo-green);
      box-shadow: 0 0 0 3px rgba(14, 107, 91, 0.1);
    }

    .btn-login {
      background: var(--contigo-green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      padding: 11px;
      width: 100%;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: #0a5247;
      color: #fff;
    }

    .error-msg {
      background: #FCEBEB;
      border-left: 3px solid #E24B4A;
      border-radius: 0 8px 8px 0;
      color: #A32D2D;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="brand">
      <div class="brand-heart"><i class="bi bi-heart-fill"></i></div>
      <span class="brand-name">Contigo</span>
    </div>
    <div class="brand-tagline">Tranquilidad, salud y compañía</div>

    {% if form.errors %}
    <div class="error-msg">
      <i class="bi bi-exclamation-circle me-1"></i>
      Usuario o contraseña incorrectos.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="id_username" class="form-label">Usuario</label>
        <input type="text" name="username" id="id_username"
               class="form-control" placeholder="tu usuario"
               autofocus autocomplete="username">
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Contraseña</label>
        <input type="password" name="password" id="id_password"
               class="form-control" placeholder="••••••••"
               autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
