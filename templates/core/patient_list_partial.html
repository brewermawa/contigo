{% for patient in patients %}
<tr>
  <td>
    <a href="{% url 'patient_detail' patient.pk %}" class="patient-name">
      {{ patient.first_name }} {{ patient.last_name }}
    </a>
  </td>
  <td>{{ patient.formatted_phone }}</td>
  <td>{{ patient.email }}</td>
  <td>
    {% if patient.address %}
      {{ patient.address.neighborhood }}, {{ patient.address.city }}
    {% else %}
      <span class="text-muted">—</span>
    {% endif %}
  </td>
  <td>
    <div class="d-flex gap-2">
      <a href="{% url 'patient_detail' patient.pk %}" class="btn-table-action" title="Ver">
        <i class="bi bi-eye"></i>
      </a>
      <a href="{% url 'patient_edit' patient.pk %}" class="btn-table-action" title="Editar">
        <i class="bi bi-pencil"></i>
      </a>
    </div>
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="5" class="text-center py-4 text-muted" style="font-size:13px;">
    <i class="bi bi-person-x fs-4 d-block mb-2"></i>
    No se encontraron pacientes
  </td>
</tr>
{% endfor %}
